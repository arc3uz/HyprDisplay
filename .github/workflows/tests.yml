name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # luac valida la sintaxis del Lua generado (tests/test_lua.py)
      - name: Instalar Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Revisar sintaxis
        run: python -m compileall hyprdisplay run.py tests

      - name: Ejecutar tests
        run: python -m unittest discover -s tests -v
