[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprdisplay"
dynamic = ["version"]
description = "Disposición de monitores con perfiles y modos rápidos para Hyprland"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HyprDisplay" }]
keywords = ["hyprland", "monitor", "wayland", "gtk4", "libadwaita"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.scripts]
hyprdisplay = "hyprdisplay.cli:main"

[tool.setuptools]
packages = ["hyprdisplay"]

[tool.setuptools.dynamic]
# Fuente única de la versión: hyprdisplay/config.py
version = { attr = "hyprdisplay.config.VERSION" }
